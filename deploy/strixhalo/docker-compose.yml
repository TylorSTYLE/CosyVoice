# CosyVoice3 OpenAI-compatible TTS on AMD Strix Halo (gfx1151).
# Run on the server:  cd deploy/strixhalo && cp .env.example .env && docker compose up -d --build
# Prereqs: git submodule update --init --recursive; model in the cosy_models volume
#          (see README.md "Model download").
services:
  cosyvoice-tts:
    build:
      context: ../..                      # repo root (Dockerfile COPYs cosyvoice/, third_party/, asset/)
      dockerfile: deploy/strixhalo/Dockerfile
      target: serve
    image: cosyvoice-strix:serve
    # gfx1151 passthrough. IMPORTANT: unlike `docker run --device /dev/dri` (which
    # recurses into the dir), compose `devices` does NOT recurse — list the specific
    # nodes or torch.cuda.is_available() will be False and the model silently runs on CPU.
    # GPU passthrough — same mapping form the host's working Ollama uses.
    # (Earlier cuda-False was NOT a device issue: a blank HSA_OVERRIDE_GFX_VERSION in .env
    #  was clobbering the image's 11.5.1 and breaking ROCm. Fixed in .env.example.)
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    env_file:
      - path: .env
        required: false
    environment:
      COSYVOICE_MODEL_DIR: /models/Fun-CosyVoice3-0.5B
      COSYVOICE_FP16: "1"
      SERVE_PORT: "8000"
    ports:
      - "${SERVE_PORT:-8880}:8000"
    volumes:
      - cosy_models:/models          # pretrained model (downloaded once, see README)
      - cosy_hf:/cache/hf            # HF cache
      - cosy_ms:/cache/modelscope    # wetext / modelscope cache
      - cosy_miopen:/cache/miopen    # MIOpen kernel cache (persist across restarts)
      - ./refs:/refs:ro              # drop reference voice clips here; point COSYVOICE_PROMPT_WAV at /refs/<file>
    restart: unless-stopped

volumes:
  # explicit name: reuse the volumes already populated by `docker run -v cosy_models:...`
  # (otherwise compose would prefix them as strixhalo_cosy_models and lose the model).
  cosy_models:
    name: cosy_models
  cosy_hf:
    name: cosy_hf
  cosy_ms:
    name: cosy_ms
  cosy_miopen:
    name: cosy_miopen
